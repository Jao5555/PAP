<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Void Defense — Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#030610;font-family:'Rajdhani',sans-serif;color:#e8eaf0;}
canvas#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;}

#ui{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;}

/* ── Título pequeno ── */
#mini-title{font-family:'Orbitron',sans-serif;font-size:clamp(18px,2.5vw,28px);
  color:#fff;letter-spacing:4px;text-shadow:0 0 20px #3366ff;margin-bottom:8px;cursor:default;}
#mini-sub{font-family:'Orbitron',sans-serif;font-size:11px;color:#2a3a5a;letter-spacing:2px;margin-bottom:8px;}

/* ── Caixa principal ── */
#login-box{
  background:rgba(6,10,26,0.96);
  border:1px solid #1e2a3a;
  border-radius:14px;
  padding:32px 40px;
  width:clamp(340px,90vw,520px);
  box-shadow:0 16px 48px rgba(0,0,0,0.6);
}
#login-box h2{font-family:'Orbitron',sans-serif;font-size:14px;color:#4466aa;
  letter-spacing:2px;margin-bottom:20px;text-align:center;}

/* ── Lista de perfis ── */
#profiles-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;max-height:280px;overflow-y:auto;}
::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-thumb{background:#1e2a3a;border-radius:2px;}

.profile-card{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;border-radius:9px;
  border:1px solid #1a2436;background:rgba(255,255,255,0.03);
  cursor:pointer;transition:.14s;
}
.profile-card:hover{border-color:#3366aa;background:rgba(30,60,180,0.1);}
.profile-card .avatar{
  width:42px;height:42px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.profile-card .info{flex:1;}
.profile-card .pname{font-family:'Orbitron',sans-serif;font-size:13px;color:#c8d8e8;margin-bottom:3px;}
.profile-card .pstats{font-size:11px;color:#445566;line-height:1.5;}
.profile-card .pstats span{color:#6688aa;margin-right:10px;}
.profile-card .enter-btn{
  font-family:'Orbitron',sans-serif;font-size:10px;
  padding:7px 14px;border-radius:6px;
  background:rgba(30,80,180,0.2);border:1px solid #3366aa;color:#6699dd;
  transition:.12s;flex-shrink:0;
}
.profile-card:hover .enter-btn{background:rgba(40,100,220,0.3);border-color:#4488ff;color:#88aaff;}
.profile-card .del-btn{
  font-size:14px;color:#332222;padding:4px 8px;border-radius:4px;
  transition:.12s;flex-shrink:0;
}
.profile-card .del-btn:hover{color:#cc4444;background:rgba(200,40,40,0.12);}

/* ── Criar novo perfil ── */
#create-section{border-top:1px solid #1a2436;padding-top:18px;}
#create-section h3{font-family:'Orbitron',sans-serif;font-size:11px;color:#334455;
  letter-spacing:1px;margin-bottom:12px;}
#new-profile-row{display:flex;gap:8px;}
#new-name-input{
  flex:1;padding:11px 14px;
  background:rgba(255,255,255,0.04);border:1px solid #1e2a3a;
  border-radius:7px;color:#e8eaf0;font-family:'Rajdhani',sans-serif;font-size:14px;
  transition:.12s;
}
#new-name-input:focus{outline:none;border-color:#3366aa;}
#new-name-input::placeholder{color:#2a3a4a;}
#create-btn{
  font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:1px;
  padding:11px 18px;border-radius:7px;cursor:pointer;
  background:rgba(30,120,60,0.2);border:1px solid #44aa44;color:#44cc44;
  transition:.14s;flex-shrink:0;white-space:nowrap;
}
#create-btn:hover{background:rgba(40,140,70,0.3);box-shadow:0 0 12px rgba(68,170,68,0.3);}
#err-msg{font-size:12px;color:#cc4444;margin-top:8px;min-height:16px;font-family:'Orbitron',sans-serif;}

/* ── Sem perfis (estado vazio) ── */
#empty-state{text-align:center;padding:20px 0;color:#334455;font-size:13px;line-height:1.8;}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="ui">
  <div id="mini-title">VOID DEFENSE</div>
  <div id="mini-sub">SELECIONA O TEU PERFIL</div>

  <div id="login-box">
    <h2>👤 QUEM ESTÁ A JOGAR?</h2>

    <div id="profiles-list">
      <!-- preenchido por JS -->
    </div>

    <div id="create-section">
      <h3>+ CRIAR NOVO PERFIL</h3>
      <div id="new-profile-row">
        <input id="new-name-input" type="text" maxlength="20" placeholder="Nome do jogador..." autocomplete="off">
        <button id="create-btn" onclick="createProfile()">✓ CRIAR</button>
      </div>
      <div id="err-msg"></div>
    </div>
  </div>
</div>

<script src="js/profile.js"></script>
<script>
// ── Fundo animado simples ───────────────────────────────────────
var canvas=document.getElementById('bg'), ctx=canvas.getContext('2d');
var W,H,stars=[],t=0;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
window.addEventListener('resize',resize); resize();
for(var i=0;i<140;i++) stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.3+0.2,s:Math.random()*0.5+0.2,ph:Math.random()*Math.PI*2});
function draw(){
  t+=0.016;
  ctx.fillStyle='#030610'; ctx.fillRect(0,0,W,H);
  var nc=ctx.createRadialGradient(W*.5,H*.4,0,W*.5,H*.4,W*.5);
  nc.addColorStop(0,'rgba(15,30,100,0.12)'); nc.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=nc; ctx.fillRect(0,0,W,H);
  for(var i=0;i<stars.length;i++){
    var s=stars[i],p=0.3+0.7*Math.abs(Math.sin(t*s.s+s.ph));
    ctx.globalAlpha=p*0.7; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r*p,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}
draw();

// ── Avatar emoji por nome ─────────────────────────────────────
var AVATARS=['🧑','👦','👩','🧒','🎮','🕹️','⚔️','🛡️','🦾','🤖','👾','🎯'];
function avatarFor(name){ return AVATARS[name.charCodeAt(0)%AVATARS.length]; }
function avatarBg(name){
  var h=['#1a2a4a','#1a3a2a','#3a1a2a','#2a1a3a','#2a3a1a','#1a3a3a'];
  return h[name.charCodeAt(0)%h.length];
}

// ── Renderizar lista de perfis ────────────────────────────────
function renderProfiles(){
  var list=document.getElementById('profiles-list');
  var profiles=PROFILE.list();
  list.innerHTML='';

  if(profiles.length===0){
    list.innerHTML='<div id="empty-state">Nenhum perfil criado ainda.<br>Cria o teu primeiro perfil abaixo!</div>';
    return;
  }

  profiles.sort(function(a,b){ return (b.lastPlayed||0)-(a.lastPlayed||0); });

  profiles.forEach(function(p){
    var s=PROFILE.summary(p.id);
    var lp=p.lastPlayed?'Última sessão: '+new Date(p.lastPlayed).toLocaleDateString('pt-PT'):'Nunca jogou';
    var card=document.createElement('div'); card.className='profile-card';
    card.innerHTML=
      '<div class="avatar" style="background:'+avatarBg(p.name)+'">'+avatarFor(p.name)+'</div>'
      +'<div class="info">'
        +'<div class="pname">'+escapeHtml(p.name)+'</div>'
        +'<div class="pstats">'
          +'<span>💰 '+s.credits+' cr</span>'
          +'<span>🏆 '+s.achievements+' conquistas</span>'
          +(s.hasSave?'<span>💾 save ativo</span>':'')
          +'<br>'+lp
        +'</div>'
      +'</div>'
      +'<button class="enter-btn" title="Entrar como '+escapeHtml(p.name)+'">ENTRAR ▶</button>'
      +'<div class="del-btn" title="Apagar perfil">🗑</div>';

    card.querySelector('.enter-btn').addEventListener('click',function(e){
      e.stopPropagation(); enterProfile(p.id);
    });
    card.querySelector('.del-btn').addEventListener('click',function(e){
      e.stopPropagation(); deleteProfile(p.id, p.name);
    });
    card.addEventListener('click',function(){ enterProfile(p.id); });
    list.appendChild(card);
  });
}

function enterProfile(id){
  PROFILE.activate(id);
  window.location.href='index.html';
}

function deleteProfile(id, name){
  if(!confirm('Apagar o perfil "'+name+'" e todos os seus dados?\nEsta ação é irreversível.')){return;}
  PROFILE.remove(id);
  renderProfiles();
}

function createProfile(){
  var input=document.getElementById('new-name-input');
  var name=input.value.trim();
  var err=document.getElementById('err-msg');

  if(!name){ err.textContent='Introduz um nome.'; return; }
  if(name.length<2){ err.textContent='Nome muito curto (mínimo 2 letras).'; return; }
  if(name.length>20){ err.textContent='Nome muito longo (máximo 20 letras).'; return; }

  var profiles=PROFILE.list();
  var dup=profiles.some(function(p){ return p.name.toLowerCase()===name.toLowerCase(); });
  if(dup){ err.textContent='Já existe um perfil com esse nome.'; return; }

  err.textContent='';
  var id=PROFILE.create(name);
  PROFILE.activate(id);
  window.location.href='index.html';
}

// Enter key on input
document.getElementById('new-name-input').addEventListener('keydown',function(e){
  if(e.key==='Enter') createProfile();
});

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Verifica se já há perfil ativo na sessão
(function(){
  var active=PROFILE.activeId();
  if(active && PROFILE.list().some(function(p){return p.id===active;})){
    // Perfil ativo válido — mostra opção de continuar como ele ou mudar
  }
})();

renderProfiles();
</script>
</body>
</html>
